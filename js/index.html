<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psychedelic Pose Projection — JavaScript</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080713;color:#f7f2ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#211044,#080713 65%);min-height:100vh}
header{padding:1rem 1.2rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(1.1rem,3vw,1.8rem);margin:0}p{color:#c8bddb;margin:.35rem 0}
main{max-width:1100px;margin:auto;padding:0 1rem 2rem}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#05040b;border:1px solid #44305f;border-radius:16px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{transform:scaleX(-1);opacity:.28}canvas{z-index:2}
.controls{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;padding:1rem 0}
button,select{background:#24143a;color:#fff;border:1px solid #8053a8;border-radius:9px;padding:.7rem 1rem;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}label{display:flex;gap:.5rem;align-items:center;color:#ded2ef}input{accent-color:#d45cff}
#status{font-size:.9rem;color:#d9b6ff}.note{font-size:.85rem;color:#a99abf}
</style>
</head>
<body>
<header><div><h1>🌀 Psychedelic Pose Projection <span style="color:#c889ff">/ JS</span></h1><p>カメラの動きに反応するリアルタイム・パーティクル投影</p></div><a href="../" style="color:#d8a8ff">評価ダッシュボードへ ↗</a></header>
<main>
<div class="stage"><video id="video" playsinline muted></video><canvas id="fx"></canvas></div>
<div class="controls"><button id="start">カメラを開始</button><button id="stop" disabled>停止</button><label>エフェクト<select id="mode"><option value="particles">粒子の残像</option><option value="rainbow">レインボー・オーラ</option><option value="rings">波紋</option></select></label><label>強度 <input id="strength" type="range" min="1" max="10" value="6"></label><span id="status">開始ボタンを押してカメラを許可してください。</span></div>
<p class="note">映像処理はブラウザー内で実行します。カメラ映像はサーバーに送信・保存しません。初回ロード時にMediaPipeのモデルをCDNから読み込みます。HTTPSまたはlocalhostで開いてください。</p>
</main>
<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const video=document.querySelector('#video'), canvas=document.querySelector('#fx'), ctx=canvas.getContext('2d');
const startBtn=document.querySelector('#start'), stopBtn=document.querySelector('#stop'), status=document.querySelector('#status');
let stream=null, landmarker=null, raf=0, lastVideoTime=-1, points=[], hue=0, running=false;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(canvas);resize();
const links=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
async function boot(){
 startBtn.disabled=true;status.textContent='モデルを読み込んでいます…';
 try{
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();running=true;stopBtn.disabled=false;status.textContent='検出中 — 体を動かしてみてください';loop();
 }catch(e){status.textContent='開始できません: '+e.message;startBtn.disabled=false;stopBtn.disabled=true;stream?.getTracks().forEach(t=>t.stop());}
}
function stop(){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,canvas.width,canvas.height);startBtn.disabled=false;stopBtn.disabled=true;status.textContent='停止しました。'}
function loop(now=performance.now()){
 if(!running)return;raf=requestAnimationFrame(loop);
 if(video.readyState<2||video.currentTime===lastVideoTime)return;lastVideoTime=video.currentTime;
 const result=landmarker.detectForVideo(video,now),pose=result.landmarks?.[0];
 const w=canvas.clientWidth,h=canvas.clientHeight,strength=Number(document.querySelector('#strength').value);
 ctx.fillStyle='rgba(5,4,11,0.20)';ctx.fillRect(0,0,w,h);hue=(hue+1.5)%360;
 if(!pose)return;
 const pts=pose.map(p=>({x:(1-p.x)*w,y:p.y*h,z:p.z,v:p.visibility??1}));
 const mode=document.querySelector('#mode').value;
 // Skeleton glow follows tracked joints; mirror coordinates to match the preview.
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 links.forEach(([a,b])=>{if(pts[a].v<.35||pts[b].v<.35)return;const A=pts[a],B=pts[b];ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle='hsla('+((hue+a*19)%360)+',100%,65%,.85)';ctx.lineWidth=2+strength*.35;ctx.shadowBlur=12+strength*2;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()});
 pts.forEach((p,i)=>{if(p.v<.35)return;const count=mode==='particles'?strength*2:mode==='rainbow'?strength:3;
  for(let j=0;j<count;j++){const angle=(j/count)*Math.PI*2+hue*.025+i,rad=mode==='rings'?(j+1)*5+((hue+i*7)%8):(j+1)*(2+strength*.3);const x=p.x+Math.cos(angle)*rad,y=p.y+Math.sin(angle)*rad;
   ctx.beginPath();ctx.arc(x,y,mode==='rings'?1.5+strength*.2:1+((j+i)%3),0,Math.PI*2);ctx.fillStyle='hsla('+((hue+i*13+j*20)%360)+',100%,65%,'+(mode==='rainbow'?.8:.65)+')';ctx.fill();}
  if(mode==='rings'&&(i===11||i===12||i===15||i===16)){ctx.beginPath();ctx.arc(p.x,p.y,8+(hue%35),0,Math.PI*2);ctx.strokeStyle='hsla('+((hue+i*17)%360)+',100%,65%,.7)';ctx.lineWidth=2;ctx.stroke();}
 });
 ctx.restore();
}
startBtn.addEventListener('click',boot);stopBtn.addEventListener('click',stop);
window.addEventListener('pagehide',()=>{running=false;stream?.getTracks().forEach(t=>t.stop())});
</script>
</body>
</html>

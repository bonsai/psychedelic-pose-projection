<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Flipbook — 1FPS</title>
<style>
body{margin:0;background:#070b12;color:#fff;font-family:system-ui,sans-serif;padding:16px}main{max-width:900px;margin:auto}
h1{font-size:1.5rem}.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
video,img{position:absolute;width:100%;height:100%;object-fit:contain}.hidden{display:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #475569;background:#111827;color:#fff;font-weight:700}
.status{color:#a5b4fc;margin-top:10px}.film{display:flex;gap:5px;overflow-x:auto;margin-top:12px}.film img{position:static;width:110px;height:70px;flex:none;border-radius:6px}
.help{color:#94a3b8}
</style></head><body><main>
<h1>📷 Camera Flipbook</h1>
<p class="help">カメラを1秒に1枚撮影して、あとでパラパラ漫画として再生します。</p>
<div class="stage"><video id="video" autoplay playsinline muted></video><img id="player" class="hidden"></div>
<div class="controls"><button id="rec">● REC</button><button id="play">▶ PLAY</button><button id="save" disabled>💾 SAVE</button></div>
<div class="status" id="status">0コマ</div><div class="film" id="film"></div>
<canvas id="canvas" class="hidden"></canvas>
<script>
(()=>{const video=document.getElementById('video'),player=document.getElementById('player'),canvas=document.getElementById('canvas'),film=document.getElementById('film'),status=document.getElementById('status');const rec=document.getElementById('rec'),play=document.getElementById('play'),save=document.getElementById('save');let stream=null,frames=[],timer=null,playTimer=null,index=0;
function ui(){const has=frames.length>0;play.disabled=!has;save.disabled=!has;status.textContent=frames.length+'コマ'+(has?' / '+(index+1)+'コマ目':'');}
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;await video.play();capture();timer=setInterval(capture,1000);rec.textContent='■ STOP';status.textContent='📷 1 FPS 撮影中 — 1コマ目';}catch(e){status.textContent='カメラを開始できませんでした。HTTPSと権限を確認してください。'}}
function capture(){if(video.videoWidth<1)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);const src=canvas.toDataURL('image/jpeg',.82);frames.push(src);index=frames.length-1;const thumb=document.createElement('img');thumb.src=src;film.appendChild(thumb);ui();}
function show(){if(!frames.length)return;player.src=frames[index];player.classList.remove('hidden');video.classList.add('hidden');ui();}
function stopCapture(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}rec.textContent='● REC';status.textContent=frames.length+'コマ撮影しました';}
function playFlip(){if(!frames.length)return;video.classList.add('hidden');player.classList.remove('hidden');clearInterval(playTimer);playTimer=setInterval(()=>{index=(index+1)%frames.length;show()},120);}
rec.onclick=()=>{if(timer){stopCapture()}else{camera()}};
play.onclick=()=>{if(!frames.length)return;playFlip()};
save.onclick=()=>{if(!frames.length)return;const w=canvas.width||640,h=canvas.height||360;const out=document.createElement('canvas');out.width=w;out.height=h*frames.length;const ctx=out.getContext('2d');let done=0;frames.forEach((src,i)=>{const im=new Image();im.onload=()=>{ctx.drawImage(im,0,i*h,w,h);if(++done===frames.length){out.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flipbook-'+Date.now()+'.jpg';a.click();URL.revokeObjectURL(a.href)},'image/jpeg',.9)}};im.src=src})};ui();})();
</script></main></body></html>

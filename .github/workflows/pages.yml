name: Deploy captf to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "data/captf/**"
      - "data/capt_frames/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload captf site
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/captf

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download model
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
          Invoke-WebRequest -Uri $url -OutFile "windows/pose_landmarker_lite.task"

      - name: Install dependencies and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name PsychedelicPoseProjection `
            --add-data "pose_landmarker_lite.task;." `
            --hidden-import mediapipe.python._framework_bindings `
            --collect-data mediapipe `
            --collect-binaries mediapipe `
            --noconfirm `
            --workpath windows/build `
            --specpath windows `
            --distpath windows/dist `
            windows/main_tasks.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsychedelicPoseProjection-windows
          path: windows/dist/PsychedelicPoseProjection.exe
